general {
    hide_cursor = false
    grace = 0
    no_fade_in = false
    no_fade_out = false
}

background {
    monitor =
    path = /home/viv/.config/themes/images/autumn.png
    blur_passes = 0
    blur_size = 0.1
    brightness = 0.5
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.15
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgba(251, 156, 72, 1)
    inner_color = rgb(239, 129, 33)
    font_color = rgba(255, 255, 255, 1)
    fade_on_empty = false
    placeholder_text = <i>I cast thunderspell!</i>
    check_color = rgba(251, 156, 72, 1)
    fail_color = rgb(f38ba8)
    rounding = 10
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(255, 255, 255)
    font_size = 64
    font_family = Maple Mono
    position = 0, 100
    halign = center
    valign = center
}
